name: 🚀 Auto Deploy to Hostinger

on:
  push:
    branches:
      - main   # or your deploy branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            set -e
            # Mirror the code but never touch server-only data:
            #   .env (production secrets) and every folder users upload into.
            rsync -a --delete \
              --exclude '.git/' \
              --exclude '.github/' \
              --exclude 'docs/' \
              --exclude 'portfolio-demo/' \
              --exclude '.env' \
              --exclude 'uploads/' \
              --exclude 'assets/img/avatars/' \
              --exclude 'contents/legislative-research-section/uploads/' \
              ~/repo/ ~/domains/lgu.jampzdev.com/public_html/
            cd ~/domains/lgu.jampzdev.com/public_html
            test -f .env || { echo "Missing .env on the server (copy .env.example and fill it in)"; exit 1; }
            php tools/migrate.php
